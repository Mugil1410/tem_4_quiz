<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team 4 Quiz</title>
    <link rel="shortcut icon" href="assets/favicon/favicon.ico">
    <!-- Preload CSS for faster rendering -->
    <link rel="preload" href="assets/bootstrap-5.3.8-dist/css/bootstrap.min.css" as="style">
    <link href="assets/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preload" href="assets/custom.css" as="style">
    <link rel="stylesheet" href="assets/custom.css">
</head>

<body>
    <div class="container text-center mt-4">
        <div class="glass-card mx-auto col-lg-6">
            <h3 id="project-name" class="mb-3">Team 4 Quiz</h3>
            <div id="landingEntry" class="mb-3">Press Spin</div>

            <div id="welcomeCard">
                <h4 id="welcomeTitle" class="mb-3"></h4>
                <h1>Welcome to Team 4 Quiz!</h1>

                <div style="font-size:40px; margin:20px 0;">
                    🧠 ❓ 🎯
                </div>

                <p style="font-size:18px; margin-bottom:25px;">
                    Get ready! 15 Questions await you.
                </p>
                <button id="startQuizBtn" class="btn btn-outline-light px-4">
                    Start Quiz
                </button>
            </div>

            <div id="wheelWrapper" class="d-none">
                <div id="wheelContainer"></div>
                <button id="spin">Spin</button>
            </div>

            <!-- Question Section -->
            <div id="questionBox" class="mt-4 d-none">
                <!-- Question Text -->
                <h5 id="questionText" class="mb-3"></h5>

                <!-- Options Will Be Inserted Here -->
                <div id="optionsBox"></div>

                <button id="spinAgainBtn" class="btn btn-warning mt-3 d-none">
                    Spin Again
                </button>
            </div>
        </div>
    </div>

    <!-- 🔊 Sounds -->
    <audio id="spinSound" src="../sounds/spin-suspense.mp3"></audio>
    <audio id="happySound" src="../sounds/happy.mp3"></audio>
    <audio id="sadSound" src="../sounds/sad.mp3"></audio>

    <footer id="teamMembers"></footer>

    <!-- Preload critical JS -->
    <link rel="preload" href="assets/jquery/jquery-4.0.0.min.js" as="script">
    <link rel="preload" href="assets/confetti.browser.js" as="script">
    <link rel="preload" href="assets/data.js" as="script">
    <link rel="preload" href="../questions.js" as="script">
    <link rel="preload" href="assets/wheel.js" as="script">
    <link rel="preload" href="assets/custom.js" as="script">

    <!-- Deferred JS loading -->
    <script src="assets/jquery/jquery-4.0.0.min.js" defer></script>
    <script src="assets/confetti.browser.js" defer></script>
    <script src="assets/data.js" defer></script>
    <script src="../questions.js" defer></script>
    <script src="assets/wheel.js" defer></script>
    <script src="assets/custom.js" defer></script>
</body>

</html>
