<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team 4 Quiz</title>

    <!-- Basic SEO -->
    <meta name="description" content="Test your knowledge with Team 4 Quiz! 15 fun and challenging questions to play and learn.">
    <meta name="keywords" content="quiz, trivia, fun, brain game, Team 4 Quiz, questions">

    <!-- Team Members -->
    <meta name="author" content="Aishwarya Jain D | Janani A | Kanmani S | Kavya Sritha K | Nivedha NP | Shivani G">

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="Team 4 Quiz">
    <meta property="og:description" content="Challenge yourself with 15 fun and exciting questions in Team 4 Quiz!">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="./assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />
    <link rel="icon" href="./assets/favicon/favicon.ico" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/custom.css">
</head>

<body>
    <div class="container text-center mt-4">
        <div class="glass-card mx-auto col-lg-6">
            <h3 id="project-name" class="mb-3">Team 4 Quiz</h3>
            <div id="landingEntry" class="mb-3"></div>

            <div id="welcomeCard">
                
                <h1>Welcome to Team 4 Quiz!</h1>

                <div style="font-size:40px; margin:20px 0;">
                    🧠 ❓ 🎯
                </div>

                <p style="font-size:18px; margin-bottom:25px;">
                    Get ready! 15 Questions await you.
                </p>

                <button id="startQuizBtn" class="btn btn-outline-light px-4">
                    Start Quiz
                </button>
            </div>

            <div id="wheelWrapper" class="d-none">
                <div id="wheelContainer"></div>
                <button id="spin">Spin</button>
            </div>

            <!-- Question Section -->
            <div id="questionBox" class="mt-4 d-none">
                <!-- Question Text -->
                <h5 id="questionText" class="mb-3"></h5>

                <!-- Options Will Be Inserted Here -->
                <div id="optionsBox"></div>

                <button id="spinAgainBtn" class="btn btn-warning mt-3 d-none">
                    Spin Again
                </button>
            </div>
        </div>
    </div>

    <!-- 🔊 Sounds -->
    <audio id="spinSound" src="../sounds/spin-suspense.mp3"></audio>
    <audio id="happySound" src="../sounds/happy.mp3"></audio>
    <audio id="sadSound" src="../sounds/sad.mp3"></audio>

    <footer id="teamMembers"></footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="./assets/data.js"></script>
    <script src="../questions.js"></script>
    <script src="./assets/wheel.js"></script>
    <script src="./assets/custom.js"></script>
</body>

</html>
